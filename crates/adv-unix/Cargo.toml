[package]
name = "adv-unix"
description = "Wine's Unix libraries as guest ELF code on the NT platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adv-cpu = { path = "../adv-cpu" }
adv-machine.workspace = true
adv-abi = { path = "../adv-abi" }
adv-nt = { path = "../adv-nt" }
log.workspace = true
thiserror.workspace = true
freetype-sys = { version = "=0.21.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_vendor = "apple", target_os = "android"))'.dev-dependencies]
adv-pe.workspace = true
adv-wineserver = { path = "../adv-wineserver" }

[build-dependencies]
cc = "1"

[lints]
workspace = true
