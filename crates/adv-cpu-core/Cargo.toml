[package]
name = "adv-cpu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Engine-neutral x86-32 execution core: CPU state, guest memory, interpreter, exact floating point and the backend interface"

[dependencies]
adv-sync = { path = "../adv-sync" }
libc = "0.2"
log.workspace = true
thiserror.workspace = true
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }

[features]
# Test hooks for engine crates' unit tests; never enabled in production.
testing = []

[build-dependencies]
cc = "1"

[lints]
workspace = true
