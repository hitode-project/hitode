[package]
name = "adv-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host platform shell: window, input, audio device, execution driver and reports"

[features]
default = []
gpu = ["adv-runtime/gpu", "adv-device/gpu", "dep:adv-display", "dep:adv-gpu"]
media = ["adv-runtime/media"]

[dependencies]
adv-display = { path = "../adv-display", optional = true }
adv-gpu = { path = "../adv-gpu", optional = true }
adv-runtime = { path = "../adv-runtime" }
adv-machine = { path = "../adv-machine" }
adv-os = { path = "../adv-os" }
adv-sync = { path = "../adv-sync" }
adv-report = { path = "../adv-report" }
png = "0.17"

[target.'cfg(not(any(target_os = "macos", target_os = "android")))'.dependencies]
adv-device = { path = "../adv-device", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
adv-display = { path = "../adv-display" }
adv-gpu = { path = "../adv-gpu" }
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
log = "0.4"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "CATransaction"] }


[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CARenderer", "objc2-metal", "objc2-core-video"] }

[[test]]
name = "macos_window"
harness = false

[lints]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
adv-display = { path = "../adv-display" }
adv-gpu = { path = "../adv-gpu" }
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
ndk-sys = "0.6"
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
adv-display = { path = "../adv-display" }
adv-gpu = { path = "../adv-gpu" }
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
log = "0.4"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "CATransaction"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIResponder", "UIView", "UITouch", "UIEvent", "UIPress", "UIPressesEvent", "UIKey", "UICommand", "UIMenuElement", "UIScreen", "UIGeometry", "UIKeyConstants", "UIWindow", "UIColor", "UIGestureRecognizer", "UIPanGestureRecognizer", "UIScreenEdgePanGestureRecognizer", "objc2-core-foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
