[package]
name = "adv-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host platform shell: window, input, audio device, execution driver and reports"

[dependencies]
adv-runtime = { path = "../adv-runtime" }
adv-machine = { path = "../adv-machine" }
adv-os = { path = "../adv-os" }
adv-sync = { path = "../adv-sync" }
png = "0.17"

[target.'cfg(windows)'.dependencies]
adv-device = { path = "../adv-device", features = ["device"] }
log = "0.4"
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
