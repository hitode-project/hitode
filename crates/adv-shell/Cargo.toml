[package]
name = "adv-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host platform shell: window, input, audio device, execution driver and reports"

[features]
default = []
gpu = ["adv-runtime/gpu", "adv-device/gpu", "dep:wgpu", "dep:pollster"]
media = ["adv-runtime/media"]

[dependencies]
adv-runtime = { path = "../adv-runtime" }
adv-machine = { path = "../adv-machine" }
adv-os = { path = "../adv-os" }
adv-sync = { path = "../adv-sync" }
adv-report = { path = "../adv-report" }
png = "0.17"
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "wgsl"] }
pollster = { version = "0.4", optional = true }

[target.'cfg(not(any(windows, target_os = "macos", target_os = "android")))'.dependencies]
adv-device = { path = "../adv-device", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }
pollster = "0.4"
log = "0.4"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "CATransaction"] }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CARenderer", "objc2-metal", "objc2-core-video"] }

[target.'cfg(windows)'.dependencies]
adv-device = { path = "../adv-device", features = ["device"] }
log = "0.4"
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "macos_window"
harness = false

[lints]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }
pollster = "0.4"
ndk-sys = "0.6"
libc = "0.2"
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
adv-device = { path = "../adv-device", features = ["device", "gpu"] }
adv-runtime = { path = "../adv-runtime", features = ["gpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }
pollster = "0.4"
libc = "0.2"
log = "0.4"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "CATransaction"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIResponder", "UIView", "UITouch", "UIEvent", "UIPress", "UIPressesEvent", "UIKey", "UICommand", "UIMenuElement", "UIScreen", "UIGeometry", "UIKeyConstants", "UIWindow", "UIColor", "objc2-core-foundation"] }
