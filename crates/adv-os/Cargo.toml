[package]
name = "adv-os"
description = "Shared guest file system, heaps, COM activation and code pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adv-abi.workspace = true
adv-cpu = { path = "../adv-cpu" }
adv-machine.workspace = true
thiserror.workspace = true
log.workspace = true
rustc-hash = "2.1"
encoding_rs.workspace = true
# Enable std only for the host I/O adapter; ISO's std feature also pulls in
# unused clock, random-number and logging support for image authoring.
hadris-iso = { version = "2.5.0", default-features = false, features = ["alloc", "sync"] }
hadris-io = { version = "2.5.0", default-features = false, features = ["std", "sync"] }

[lints]
workspace = true

[dev-dependencies]
adv-abi.workspace = true
