[package]
name = "adv-os"
description = "OS layer: PE loading, the module table, the guest file system, heaps and code pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adv-abi.workspace = true
adv-cpu = { path = "../adv-cpu" }
adv-machine.workspace = true
adv-pe.workspace = true
thiserror.workspace = true
log.workspace = true
encoding_rs.workspace = true
# Enable std only for the host I/O adapter; ISO's std feature also pulls in
# unused clock, random-number and logging support for image authoring.
hadris-iso = { version = "2.5.0", default-features = false, features = ["alloc", "sync"] }
hadris-io = { version = "2.5.0", default-features = false, features = ["std", "sync"] }

[lints]
workspace = true

[dev-dependencies]
adv-abi.workspace = true
adv-unicorn = { path = "../adv-unicorn" }
adv-samples.workspace = true
