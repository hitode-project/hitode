[package]
name = "adv-gpu"
description = "GPU layer: the only Vulkan and Metal user; devices, resources by role, pipelines, encoding, completion and presentable buffers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec = "0.7"
bitflags = "2"
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in", "spv-in"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["spv-out"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["msl-out"] }
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "dispatch2", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer",
    "MTLCommandEncoder", "MTLEvent", "MTLResource", "MTLBuffer", "MTLTexture",
    "MTLSampler", "MTLPixelFormat", "MTLTypes", "MTLRenderPass",
    "MTLRenderCommandEncoder", "MTLRenderPipeline", "MTLDepthStencil",
    "MTLBlitCommandEncoder", "MTLComputePass", "MTLComputeCommandEncoder",
    "MTLCounters", "MTLLibrary", "MTLArgument", "MTLBinaryArchive", "MTLFence", "MTLComputePipeline",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSString", "NSRange", "NSArray", "NSError", "NSProcessInfo",
] }
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }

[lints]
workspace = true
