[package]
name = "adv-dx"
description = "Personality layer: COM device fronts (DirectDraw, DirectSound)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
gpu = ["adv-device/gpu"]
# Compile-time diagnostics; omitted entirely from ordinary draw/state paths.
d3d9-counters = []
# DirectShow movie decoding through FFmpeg (needs FFMPEG_DIR at build time).
media = ["adv-device/media"]

[dependencies]
adv-abi.workspace = true
adv-cpu = { path = "../adv-cpu" }
adv-machine.workspace = true
adv-os.workspace = true
adv-device = { path = "../adv-device" }
adv-sync = { path = "../adv-sync" }
bytemuck = "1"
log.workspace = true
naga = { version = "=30.0.1", features = ["wgsl-in"] }
sha2 = "0.10"
rustc-hash = "2.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
png = "0.17"

[dev-dependencies]
adv-win32 = { path = "../adv-win32" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }
pollster = "0.4"

[lints]
workspace = true
