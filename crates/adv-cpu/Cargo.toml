[package]
name = "adv-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Execution layer facade: the platform's x86-32 engine over the engine-neutral core"

[dependencies]
adv-cpu-x64 = { path = "../adv-cpu-x64" }

[features]
jit-verifier = ["adv-cpu-x64/jit-verifier"]
gir-capture = ["adv-cpu-x64/gir-capture"]
gir-lift = ["adv-cpu-x64/gir-lift"]
cross-dump = ["adv-cpu-x64/cross-dump"]

[dev-dependencies]
adv-cpu = { path = ".", features = ["jit-verifier"] }
adv-sync = { path = "../adv-sync" }
adv-unicorn = { path = "../adv-unicorn" }
cranelift-codegen = "0.125"
cranelift-frontend = "0.125"
cranelift-jit = "0.125"
cranelift-module = "0.125"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }
libc = "0.2"
serde_json = "1"
unicorn-engine.workspace = true

[lints]
workspace = true
