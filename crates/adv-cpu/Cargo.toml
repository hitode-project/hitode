[package]
name = "adv-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Execution layer: x86-32 interpreter, hot-region JIT and the guest CPU backend interface"

[dependencies]
adv-sync = { path = "../adv-sync" }
libc = "0.2"
thiserror.workspace = true
cranelift-codegen = "0.125"
cranelift-frontend = "0.125"
cranelift-jit = "0.125"
cranelift-module = "0.125"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
adv-unicorn = { path = "../adv-unicorn" }
serde_json = "1"
unicorn-engine.workspace = true

[lints]
workspace = true
