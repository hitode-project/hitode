[package]
name = "adv-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Guest GDI/DirectDraw software surfaces and a common presentation boundary"

[dependencies]
pal-host = { path = "../pal-host" }
adv-jit = { path = "../adv-jit", features = ["pal"] }
pal-cpu = { path = "../pal-cpu", default-features = false }
pal-machine = { path = "../pal-machine" }
pal-win32 = { path = "../pal-win32" }
pal-audio = { path = "../pal-audio" }
pal-pe = { path = "../pal-pe" }
ogg = "0.9.2"
symphonia = { version = "0.5.5", default-features = false, features = ["vorbis", "wav", "pcm", "adpcm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[dev-dependencies]
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
pal-cpu = { path = "../pal-cpu", default-features = false, features = ["unicorn"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }
png = "0.17"

[lints]
workspace = true
