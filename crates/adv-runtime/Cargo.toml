[package]
name = "adv-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guest GDI/DirectDraw software surfaces and a common presentation boundary"

[dependencies]
adv-sync = { path = "../adv-sync" }
adv-cpu = { path = "../adv-cpu" }
adv-machine = { path = "../adv-machine" }
adv-win32 = { path = "../adv-win32" }
adv-device = { path = "../adv-device" }
adv-pe = { path = "../adv-pe" }
ogg = "0.9.2"
symphonia = { version = "0.5.5", default-features = false, features = ["vorbis", "wav", "pcm", "adpcm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[dev-dependencies]
unicorn-engine.workspace = true
adv-unicorn = { path = "../adv-unicorn" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }
png = "0.17"

[lints]
workspace = true
