[package]
name = "adv-cpu-a64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "AArch64 thin translator over the adv-cpu core"

[dependencies]
adv-cpu-core = { path = "../adv-cpu-core" }
adv-sync = { path = "../adv-sync" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
rustc-hash = "2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }

# Android test binaries run translated code natively instead.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
unicorn-engine = { workspace = true, features = ["arch_aarch64"] }

[lints]
workspace = true
