[package]
name = "adv-device"
description = "Device layer: software surfaces, PCM mixing, resampling and audio output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
device = ["dep:cpal"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:windows"]
# FFmpeg movie decoding; needs FFMPEG_DIR (see docs/media-build.md).
media = ["dep:ffmpeg-next"]
# Full DAC rate matrices; `cargo test-full` enables it.
slow-tests = []

[dependencies]
cpal = { version = "0.16", optional = true }
log.workspace = true
adv-sync = { path = "../adv-sync" }
rubato = { version = "0.16", default-features = false }
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "adpcm", "vorbis"] }
ogg = "0.9.2"
ffmpeg-next = { version = "8.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "dx12", "vulkan", "gles", "wgsl"] }
bytemuck = { version = "1.23", optional = true, features = ["derive"] }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Globalization"] }
# The broad gpu-allocator windows range must select wgpu-hal's ABI version,
# instead of reusing the older windows crate required by the WASAPI backend.
windows = { version = "=0.62.2", optional = true }

[target.'cfg(not(windows))'.dependencies]
# One portable outline/raster stack. Font discovery needs no native fontconfig
# library or unsafe mapping, including on Android.
skrifa = "0.44"
zeno = "0.3.3"
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
encoding_rs.workspace = true
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[[test]]
name = "gpu"
required-features = ["gpu"]
