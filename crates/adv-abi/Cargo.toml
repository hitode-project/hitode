[package]
name = "adv-abi"
description = "Typed x86 Win32 ABI, generated metadata, registry, diagnostics and failure stubs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adv-machine.workspace = true
adv-pe.workspace = true
adv-cpu = { path = "../adv-cpu" }
adv-abi-macros = { path = "../adv-abi-macros" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[dev-dependencies]
adv-unicorn = { path = "../adv-unicorn" }

[lints]
workspace = true
