[package]
name = "adv-win32"
description = "Personality layer: Win32 API behaviour (kernel32, user32, gdi32, advapi32, winmm, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adv-abi.workspace = true
adv-sync = { path = "../adv-sync" }
adv-cpu = { path = "../adv-cpu" }
adv-machine.workspace = true
adv-os.workspace = true
adv-device = { path = "../adv-device" }
adv-pe.workspace = true
log.workspace = true
encoding_rs.workspace = true
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[lints]
workspace = true

[dev-dependencies]
adv-unicorn = { path = "../adv-unicorn" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
