[workspace]
resolver = "3"
members = [
    "crates/adv-abi",
    "crates/adv-cpu",
    "crates/adv-device",
    "crates/adv-machine",
    "crates/adv-pe",
    "crates/adv-runtime",
    "crates/adv-samples",
    "crates/adv-sync",
    "crates/adv-unicorn",
    "crates/adv-win32",
    "apps/adv-run",
]
exclude = ["vendor/cpal", "vendor/symphonia-codec-adpcm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
adv-abi = { path = "crates/adv-abi" }
adv-pe = { path = "crates/adv-pe" }
adv-machine = { path = "crates/adv-machine" }
adv-samples = { path = "crates/adv-samples" }

unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
thiserror = "2"
log = "0.4"
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package.unicorn-engine-sys]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
cpal = { path = "vendor/cpal" }
symphonia-codec-adpcm = { path = "vendor/symphonia-codec-adpcm" }
