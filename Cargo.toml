[workspace]
resolver = "3"
members = [
    "crates/adv-abi",
    "crates/adv-abi-macros",
    "crates/adv-cpu",
    "crates/adv-cpu-core",
    "crates/adv-cpu-x64",
    "crates/adv-cpu-a64",
    "crates/adv-device",
    "crates/adv-dx",
    "crates/adv-machine",
    "crates/adv-nt",
    "crates/adv-os",
    "crates/adv-pe",
    "crates/adv-report",
    "crates/adv-runtime",
    "crates/adv-samples",
    "crates/adv-shell",
    "crates/adv-sync",
    "crates/adv-unicorn",
    "crates/adv-win32",
    "crates/adv-wineserver",
    "apps/adv-run",
    "apps/adv-jit-helper",
    "apps/adv-launcher/src-tauri",
]
exclude = ["vendor/cpal", "vendor/symphonia-codec-adpcm"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
adv-abi = { path = "crates/adv-abi" }
adv-pe = { path = "crates/adv-pe" }
adv-machine = { path = "crates/adv-machine" }
adv-os = { path = "crates/adv-os" }
adv-samples = { path = "crates/adv-samples" }

unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
thiserror = "2"
log = "0.4"
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package.unicorn-engine-sys]
opt-level = 3
debug = false

# Third-party crates are built once and cached. Unoptimized, the resampler's FFT
# makes the DAC tests take minutes. Workspace crates keep the plain debug profile.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
cpal = { path = "vendor/cpal" }
symphonia-codec-adpcm = { path = "vendor/symphonia-codec-adpcm" }
