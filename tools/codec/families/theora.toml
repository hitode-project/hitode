sources = ["apiwrapper", "bitpack", "decapiwrapper", "decinfo", "decode", "dequant", "fragment", "huffdec", "idct", "info", "internal", "quant", "state"]
# Linking resolves the relocation to the base of the mode table minus one row.
biased_symbols = { OC_MODE_ALPHABETS = -8 }
header = '"decint.h"'
roots = { packet = "th_decode_packetin", alloc = "th_decode_alloc", free = "th_decode_free" }
hooks = { init = "oc_dec_init", clear = "oc_state_clear" }
roles = { state_init = "oc_state_init" }
driver = '''
int main(int argc, char **argv) {
  th_info info;
  th_comment comment;
  th_setup_info *setup = 0;
  ogg_packet packet = {0};
  ogg_int64_t granpos;
  th_info_init(&info);
  th_comment_init(&comment);
  packet.packet = (unsigned char *)argv[0];
  packet.bytes = argc;
  int status = th_decode_headerin(&info, &comment, &setup, &packet);
  th_dec_ctx *decoder = th_decode_alloc(&info, setup);
  if (decoder) status = th_decode_packetin(decoder, &packet, &granpos);
  th_decode_free(decoder);
  th_setup_free(setup);
  th_info_clear(&info);
  th_comment_clear(&comment);
  return status;
}
'''

