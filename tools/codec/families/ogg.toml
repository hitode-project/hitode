sources = ["src/framing.c", "src/bitwise.c"]
header = '<ogg/ogg.h>'
roots = { packetout = "ogg_stream_packetout", packetpeek = "ogg_stream_packetpeek" }
roles = { packet = "_packetout" }
driver = '''
int main(int argc, char **argv) {
  ogg_stream_state stream;
  ogg_packet packet;
  if (ogg_stream_init(&stream, argc)) return 1;
  int peek = ogg_stream_packetpeek(&stream, &packet);
  int out = ogg_stream_packetout(&stream, &packet);
  ogg_stream_clear(&stream);
  return peek != out;
}
'''

