sources = ["lib/mdct.c"]
header = '"mdct.h"'
roots = { main = "mdct_backward" }
roles = { bitreverse = "mdct_bitreverse", butterflies = "mdct_butterflies", first = "mdct_butterfly_first", butterfly16 = "mdct_butterfly_16" }
driver = '''
int main(int argc, char **argv) {
  mdct_lookup lookup;
  float input[64] = {0}, output[64];
  mdct_init(&lookup, 64);
  mdct_backward(&lookup, input, output);
  mdct_clear(&lookup);
  return output[argc & 63] != 0;
}
'''

