[package]
name = "adv-launcher"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs a newer compiler than the rest of the workspace.
rust-version = "1.90"
license.workspace = true
publish.workspace = true
description = "Tauri launcher: game library and in-game overlay over the native game view"

[lib]
name = "adv_launcher"

[[bin]]
name = "adv-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
adv-shell = { path = "../../../crates/adv-shell" }
adv-report = { path = "../../../crates/adv-report" }
getrandom = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
base64 = "0.23"
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
tauri = { version = "=2.12.3", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
adv-shell = { path = "../../../crates/adv-shell", features = ["media"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[lints]
workspace = true
