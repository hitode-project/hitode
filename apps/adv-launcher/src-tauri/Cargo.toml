[package]
name = "adv-launcher"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs a newer compiler than the rest of the workspace.
rust-version = "1.90"
license.workspace = true
publish.workspace = true
description = "Tauri launcher: game library and in-game overlay over the native game view"

[lib]
name = "adv_launcher"

[[bin]]
name = "adv-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
adv-shell = { path = "../../../crates/adv-shell" }
tauri = { version = "=2.12.3", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
