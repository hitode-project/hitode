[package]
name = "adv-launcher"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs a newer compiler than the rest of the workspace.
rust-version = "1.90"
license.workspace = true
publish.workspace = true
description = "Tauri launcher: game library and in-game overlay over the native game view"

[lib]
name = "adv_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adv-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
flate2 = "1.1.10"
sha2 = "0.10.9"

[dependencies]
adv-shell = { path = "../../../crates/adv-shell" }
adv-report = { path = "../../../crates/adv-report" }
getrandom = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
base64 = "0.23"
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tauri = { version = "=2.12.3", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1.10"
# Opens the VNDB and release links on every platform.
tauri-plugin-opener = "=2.7.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-storage = { path = "plugins/storage" }

[target.'cfg(target_os = "android")'.dependencies]
# Video needs the static Android FFmpeg from `tools/macos/build.py --android`.
adv-shell = { path = "../../../crates/adv-shell", features = ["media"] }
jni = "0.21.1"
ndk-sys = "0.6"
log.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
# Video needs the static iOS FFmpeg from `tools/macos/build.py --ios`; build.rs
# bundles it into the staticlib that Xcode links.
adv-shell = { path = "../../../crates/adv-shell", features = ["media"] }
log.workspace = true
plist = "1.8"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSNotification", "NSOperation", "block2"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "UIApplication", "UIResponder", "UIView", "objc2-core-foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
adv-shell = { path = "../../../crates/adv-shell", features = ["media"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[lints]
workspace = true
