name: adv-launcher
options:
  bundleIdPrefix: org.hitode.launcher
  deploymentTarget:
    iOS: 18.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Hitode
      PRODUCT_BUNDLE_IDENTIFIER: org.hitode.launcher
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  adv-launcher_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: adv-launcher_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: adv-launcher_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: Connect to this device through LocalDevVPN to enable JIT.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Finder file sharing also exposes the app's Documents folder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: 0.2.3
        CFBundleVersion: "0.2.3"
    entitlements:
      path: adv-launcher_iOS/adv-launcher_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
      configs:
        release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
    dependencies:
      - target: HitodeJIT
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: VideoToolbox.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          # The AppIcon images are generated, not committed: an asset catalog without
          # them builds an app with no icon.
          icons="$SRCROOT/Assets.xcassets/AppIcon.appiconset"
          for name in $(sed -n 's/.*"filename" *: *"\([^"]*\)".*/\1/p' "$icons/Contents.json"); do
            [ -f "$icons/$name" ] || cp "$SRCROOT/../../icons/ios/$name" "$icons/" || {
              echo "error: AppIcon $name is missing; run apps/adv-launcher/scripts/icons.py" >&2
              exit 1
            }
          done
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  HitodeJIT:
    type: app-extension
    platform: iOS
    sources:
      - path: JitHelper
    info:
      path: JitHelper/Info.plist
      properties:
        CFBundleDisplayName: Hitode JIT
        CFBundleShortVersionString: 0.2.3
        CFBundleVersion: "0.2.3"
        NSLocalNetworkUsageDescription: Connect to this device through LocalDevVPN to enable JIT.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ar.viewer
          NSExtensionPrincipalClass: HitodeJitRequestHandler
          NSExtensionAttributes:
            NSExtensionActivationRule: FALSEPREDICATE
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_NAME: HitodeJIT
        PRODUCT_BUNDLE_IDENTIFIER: org.hitode.launcher.JitHelper
        # Tauri signs only the app target; scripts/ios-team.mjs fills this in before xcodebuild.
        DEVELOPMENT_TEAM: $(APPLE_DEVELOPMENT_TEAM)
        ARCHS: [arm64]
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: $(inherited) -ladv_jit_helper -liconv -lresolv
      configs:
        release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
    dependencies:
      - sdk: Foundation.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Build JIT Helper
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../../../../.."
          export CARGO_TARGET_DIR="$PWD/target"
          target=aarch64-apple-ios
          if [ "$PLATFORM_NAME" = iphonesimulator ]; then target=aarch64-apple-ios-sim; fi
          profile=debug
          release=""
          if [ "$CONFIGURATION" = release ]; then
            profile=release
            release=--release
            export CARGO_PROFILE_RELEASE_STRIP=debuginfo
            sep=$(printf '\037')
            flags="${CARGO_ENCODED_RUSTFLAGS-$(printf '%s' "${RUSTFLAGS-}" | tr ' ' '\037')}"
            for remap in "$HOME=/home" "${CARGO_HOME:-$HOME/.cargo}=/cargo" "${RUSTUP_HOME:-$HOME/.rustup}=/rustup" "$PWD=/hitode"; do
              flags="${flags:+$flags$sep}--remap-path-prefix=$remap"
            done
            export CARGO_ENCODED_RUSTFLAGS="$flags"
          fi
          cargo build --locked -p adv-jit-helper --target "$target" $release
          cp "$CARGO_TARGET_DIR/$target/$profile/libadv_jit_helper.a" "$BUILT_PRODUCTS_DIR/"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libadv_jit_helper.a
