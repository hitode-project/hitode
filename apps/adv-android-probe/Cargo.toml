[package]
name = "adv-android-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded Android application-process interpreter and Cranelift JIT probe"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adv-cpu = { path = "../../crates/adv-cpu" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "code_asm"] }
jni = "0.21.1"
libc = "0.2"
serde_json = "1"

[lints]
workspace = true
