[package]
name = "adv-jit-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "iOS app extension that debugs the player to grant it JIT (IOS-JIT-2)"

[lib]
crate-type = ["staticlib", "rlib"]

# Everything that talks to the device is iOS-only; the protocol module and
# its tests build everywhere.
[target.'cfg(target_os = "ios")'.dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "remote_pairing", "tunnel_tcp_stack", "rsd", "debug_proxy", "mobile_image_mounter", "cryptexd", "tss"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSExtensionContext", "NSExtensionRequestHandling", "NSExtensionItem", "NSString"] }

[dev-dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "debug_proxy"] }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
