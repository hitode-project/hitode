name: Game does not run / 游戏跑不起来
description: Tell us which game has a problem and what happened.
title: "<game>: <what happened>"
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Search for the game first; if it has an issue, add to it. Maintainers link issues that share a cause.
        提交前先搜一下游戏名，已有就在那里回复。同一原因的问题由维护者归到一起。
  - type: input
    id: game
    attributes:
      label: Game / 游戏
      description: Title, and its VNDB link if you have it.
    validations:
      required: true
  - type: input
    id: patch
    attributes:
      label: Patch / 补丁
      description: Localization or other patches applied, or "none".
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options: [macOS, iOS / iPadOS, Android]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened / 发生了什么
      description: Where it stopped or went wrong, and what you saw.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report / 报告
      description: Optional. Paste the anonymous report the launcher saved.
      render: json
