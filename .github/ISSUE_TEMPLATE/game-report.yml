name: Game report / 游戏兼容报告
description: Report how a game plays, whether it works or not.
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game / 游戏
      description: Title, and its VNDB link if you have it.
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine / 引擎
      description: Engine and version if you know them, or "unknown".
  - type: input
    id: patch
    attributes:
      label: Patch / 补丁
      description: Localization or other patches applied, or "none".
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options: [macOS, iOS / iPadOS, Android]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Hitode version / 设备与 Hitode 版本
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: From a new game to the end of the first chapter / 从新游戏玩到第一章结束
      description: Tick what worked. / 勾选正常的项目。
      options:
        - label: Reached the end of the first chapter / 玩完了第一章
        - label: Text / 文字
        - label: Graphics / 画面
        - label: Sound / 声音
        - label: Video / 视频
        - label: Saving and loading / 存档读档
        - label: Settings / 设置
  - type: textarea
    id: details
    attributes:
      label: What went wrong / 出了什么问题
      description: Where it happened and what you saw. Leave empty if everything worked.
  - type: textarea
    id: report
    attributes:
      label: Compatibility report / 兼容报告
      description: Paste the anonymous report the launcher saved, if any.
      render: json
