name: Verify performance patch delivery
on:
  push:
    branches: [perf/tiered-execution-10x]
    paths: ['.github/workflows/repair-verified-delivery.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ttyymm233/adv-host' && github.ref == 'refs/heads/perf/tiered-execution-10x'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: perf/tiered-execution-10x
      - name: Restore transport and verify the exact locally tested source
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, re, subprocess
          workflow = pathlib.Path('.github/workflows/apply-verified-performance.yml').read_text()
          encoded = re.search(r"encoded = '''(.*?)'''", workflow, re.S).group(1)
          encoded = encoded.replace('WFXK4aKO', 'WFXK4KO')
          first = encoded.find('odeiia')
          second = encoded.find('odeiia', first + 6)
          if first >= 0 and second >= 0:
              encoded = encoded[:first] + encoded[second:]
          pathlib.Path('delivery-normalized.b64').write_text(encoded)
          print('Encoded length:', len(encoded))
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'a3d37d6e9fdf33aaf67339ea33d7b79bbeb3ee39257f10405a9186250a283f59'
          before = {
              'crates/adv-jit/src/machine.rs': 'bd745f913233e6fe41d850535a690c29a537ff36',
              'crates/adv-jit/src/interpreter.rs': '5eff379e10b94315a3963ab9e76d306741f315ba',
              'crates/adv-jit/src/compile.rs': '4fcad6724307a894d4c8c8dc5fb9e6ef56d4735b',
          }
          after = {
              'crates/adv-jit/src/machine.rs': 'b4fd842a46484c1150a26811aaf74b35a9a1e7c6',
              'crates/adv-jit/src/interpreter.rs': '77aa89e2a6b2fb01c644cacdc7121dfe120fdc25',
              'crates/adv-jit/src/compile.rs': '0e4f7b0abd9b8344c5deb32df308345982686eee',
              'crates/adv-jit/tests/batched_execution.rs': 'afb826cf7ae16ce3bfe7c27daffe250a49b5a17c',
              'crates/adv-jit/examples/execution_bench.rs': 'd5243b00056c015d56431a2d03ce8c7182e9c3b0',
          }
          for path, expected in before.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for path, expected in after.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('All five source blobs match the tested candidate exactly.')
      - name: Commit verified source and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/adv-jit/src/machine.rs crates/adv-jit/src/interpreter.rs crates/adv-jit/src/compile.rs crates/adv-jit/tests/batched_execution.rs crates/adv-jit/examples/execution_bench.rs
          git rm .github/workflows/apply-verified-performance.yml .github/workflows/repair-verified-delivery.yml .github/workflows/offline-validation.yml
          git commit -m 'perf: batch interpreted blocks, tier hot native regions, and retain unchanged code'
          git push origin HEAD:perf/tiered-execution-10x
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: delivery-diagnostic
          include-hidden-files: true
          path: |
            .github/workflows/apply-verified-performance.yml
            delivery-normalized.b64
          retention-days: 1
