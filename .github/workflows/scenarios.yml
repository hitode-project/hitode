name: Behavior scenarios

# The merge base judges the head (docs/spec/README.md#scenarios). This
# workflow and tools/scenarios/run.py run from the base branch, so a pull
# request cannot loosen the gate that judges it. The head is checked out only
# as data to build; the token is read-only and no secrets are used.
on:
  push:
    branches: [master]
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: scenarios (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: gate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: head
      - name: Find the merge base
        run: |
          cd head
          if [[ "${{ github.event_name }}" == push ]]; then
            base=$(git rev-parse HEAD^1)
          else
            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
            base=$(git merge-base FETCH_HEAD HEAD)
          fi
          git worktree add --detach ../base "$base"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Test the judgment
        run: python3 -m unittest discover -s gate/tools/scenarios -v
      - name: Cache pinned FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            head/target/macos-ffmpeg/*/install
            head/target/macos-ffmpeg/*.tar.xz
          key: macos-arm64-ffmpeg-${{ hashFiles('head/tools/macos/build.py', 'head/tools/macos/ffmpeg.json') }}
      - name: Cache pinned Wine userland
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: head/target/wine-dist
          key: wine-dist-${{ hashFiles('head/tools/release/wine.json') }}
      - name: Prepare FFmpeg, the Wine userland and the guest compiler
        timeout-minutes: 15
        run: |
          rustup update stable --no-self-update
          cd head
          python3 tools/macos/build.py --ffmpeg-only --jobs 3
          prefix=("$PWD"/target/macos-ffmpeg/*/install)
          echo "FFMPEG_DIR=${prefix[0]}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(dirname "$(xcrun --find clang)")")/lib" >> "$GITHUB_ENV"
          python3 tools/release/fetch_wine.py target/wine-dist dist
          echo "WINE_DIST=$PWD/target/wine-dist/wine11-sse-strip" >> "$GITHUB_ENV"
          brew install mingw-w64
      - name: Restore the base build
        id: base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bin/cached
          key: scenario-adv-run-${{ env.BASE_SHA }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'head -> target'
          key: scenarios
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the head
        timeout-minutes: 30
        run: |
          cd head
          cargo build --release --locked -p adv-run --features adv-shell/gpu,adv-shell/media
          mkdir -p ../bin/head && cp target/release/adv-run ../bin/head/adv-run
      - name: Build the base when no cached build exists
        if: steps.base.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          cd base
          CARGO_TARGET_DIR=../head/target cargo build --release --locked -p adv-run --features adv-shell/gpu,adv-shell/media
          mkdir -p ../bin/cached && cp ../head/target/release/adv-run ../bin/cached/adv-run
      - name: Judge the head by its merge base
        timeout-minutes: 20
        run: |
          set -o pipefail
          python3 gate/tools/scenarios/run.py gate \
            --base-tree base --base-bin bin/cached/adv-run \
            --head-tree head --head-bin bin/head/adv-run \
            --wine "$WINE_DIST" --out "$RUNNER_TEMP/scenarios.json" 2>&1 | tee "$RUNNER_TEMP/scenarios.txt"
      - name: Replace the cached build with the master head
        if: github.event_name == 'push'
        run: rm -rf bin/cached && cp -R bin/head bin/cached
      - name: Keep the head build for later merge bases
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bin/cached
          key: scenario-adv-run-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenarios-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/scenarios.json
            ${{ runner.temp }}/scenarios.txt
          if-no-files-found: ignore
          retention-days: 14
