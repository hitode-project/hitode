name: ARM64 hardware acceptance

# Real ARM64 hardware for the parts QEMU cannot model: instruction cache
# coherence, weak memory ordering and (on Apple Silicon) native 16 KiB pages.
# Synthetic fixtures only; no samples are available or referenced here.
# Android sigchain/ART coexistence still needs a device and is not covered.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'tools/cpu/**'
      - 'tools/performance/**'
      - '.github/workflows/arm64-acceptance.yml'
  push:
    branches:
      - 'ci/arm64**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # x64 runs the same steps so ARM64-only failures stand out.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          rustup update stable --no-self-update
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; echo "page size: $(getconf PAGESIZE)"; lscpu; } > "$RUNNER_TEMP/environment.txt"
          cat "$RUNNER_TEMP/environment.txt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Lint execution layer
        run: cargo clippy --release --locked -p adv-cpu --all-targets -- -D warnings
      - name: Test execution layer
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/tests.txt"
      - name: Differential tier verification (strict)
        # Tests that assert native execution shape fail under verification by
        # design; the log is compared against the x64 strict failure set.
        if: always()
        continue-on-error: true
        env:
          ADV_JIT_VERIFY: strict
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --tests 2>&1 | tee "$RUNNER_TEMP/strict.txt"
      - name: Direct memory execution layer
        if: always()
        env:
          ADV_DIRECT_MEMORY: '1'
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/direct.txt"
      - name: Direct memory differential verification (strict)
        if: always()
        continue-on-error: true
        env:
          ADV_DIRECT_MEMORY: '1'
          ADV_JIT_VERIFY: strict
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/direct-strict.txt"
      - name: Full regression including Bridge differential fixtures (checked and direct)
        if: always() && matrix.runner == 'ubuntu-24.04-arm'
        # The bridge differential fixtures select each lane explicitly so their
        # Tier 0 and Cranelift-only references remain independent. ADV_TIER1 is a
        # shell option; it cannot turn CPU tests into Bridge tests. The native
        # fixtures assert actual bridge retirements and Cranelift handoff.
        run: |
          set +e
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/bridge.txt"
          checked=${PIPESTATUS[0]}
          ADV_DIRECT_MEMORY=1 cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/bridge-direct.txt"
          direct=${PIPESTATUS[0]}
          test "$checked" -eq 0 && test "$direct" -eq 0
      - name: Bridge coexistence differential verification (strict)
        if: always() && matrix.runner == 'ubuntu-24.04-arm'
        continue-on-error: true
        env:
          ADV_JIT_VERIFY: strict
        run: |
          set +e
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/bridge-strict.txt"
          checked=${PIPESTATUS[0]}
          ADV_DIRECT_MEMORY=1 cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests 2>&1 | tee "$RUNNER_TEMP/bridge-direct-strict.txt"
          direct=${PIPESTATUS[0]}
          test "$checked" -eq 0 && test "$direct" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-${{ matrix.runner }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/environment.txt
            ${{ runner.temp }}/tests.txt
            ${{ runner.temp }}/strict.txt
            ${{ runner.temp }}/direct.txt
            ${{ runner.temp }}/direct-strict.txt
            ${{ runner.temp }}/bridge.txt
            ${{ runner.temp }}/bridge-direct.txt
            ${{ runner.temp }}/bridge-strict.txt
            ${{ runner.temp }}/bridge-direct-strict.txt
          if-no-files-found: ignore
          retention-days: 14

  macos-arm64:
    # Probe: macOS is not yet a supported execution host, so a failure here is
    # a finding to triage rather than a regression gate.
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          rustup update stable --no-self-update
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; sw_vers; echo "page size: $(sysctl -n hw.pagesize)"; sysctl -n machdep.cpu.brand_string; } > "$RUNNER_TEMP/environment.txt"
          cat "$RUNNER_TEMP/environment.txt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Build execution layer and tests
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-run 2>&1 | tee "$RUNNER_TEMP/build.txt"
      - name: Test execution layer
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --no-fail-fast --lib --tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/tests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-macos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/environment.txt
            ${{ runner.temp }}/build.txt
            ${{ runner.temp }}/tests.txt
          if-no-files-found: ignore
          retention-days: 14
