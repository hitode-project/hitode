name: Core execution validation

on:
  pull_request:
    paths:
      - 'crates/adv-jit/**'
      - 'tools/performance/**'
      - '.github/workflows/core-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/core-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; lscpu; } > "$RUNNER_TEMP/core-environment.txt"
          cat "$RUNNER_TEMP/core-environment.txt"
      - name: Test runtime comparison gates
        run: python3 -m unittest discover -s tools/performance -v
      - name: Prepare isolated core crate
        shell: python
        run: |
          import os, pathlib, re, shutil
          source = pathlib.Path('crates/adv-jit')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'adv-jit-core'
          shutil.copytree(source, target)
          manifest = (source / 'Cargo.toml').read_text()
          manifest = manifest.replace('edition.workspace = true', 'edition = "2024"')
          manifest = manifest.replace('publish.workspace = true', 'publish = false')
          manifest = manifest.replace('pal = ["dep:pal-cpu"]', 'pal = []')
          manifest = re.sub(r'^pal-(?:cpu|machine|win32)\s*=.*\n', '', manifest, flags=re.M)
          manifest = manifest.replace('[lints]\nworkspace = true', '[workspace]')
          (target / 'Cargo.toml').write_text(manifest)
          shutil.copy('Cargo.lock', target / 'Cargo.lock')
          # This gate is NOT full workspace/runtime validation. Keep every
          # independent test and expose every excluded adapter test in the log.
          for test in (target / 'tests').glob('*.rs'):
              if re.search(r'\bpal_(?:cpu|machine|win32)\b|adv_jit::pal\b', test.read_text()):
                  print('SKIP sibling-dependent test:', test.name)
                  test.rename(test.with_suffix('.rs.disabled'))
      - name: Test core library and independent integration tests
        run: |
          set -o pipefail
          cargo test --release --manifest-path "$RUNNER_TEMP/adv-jit-core/Cargo.toml" --lib --tests 2>&1 | tee "$RUNNER_TEMP/core-tests.txt"
      - name: Record diagnostic synthetic benchmark
        run: |
          set -o pipefail
          cargo build --release --manifest-path "$RUNNER_TEMP/adv-jit-core/Cargo.toml" --example execution_bench
          "$CARGO_TARGET_DIR/release/examples/execution_bench" 7 | tee "$RUNNER_TEMP/core-bench.csv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-environment.txt
            ${{ runner.temp }}/core-tests.txt
            ${{ runner.temp }}/core-bench.csv
            ${{ runner.temp }}/adv-jit-core/Cargo.lock
          if-no-files-found: ignore
          retention-days: 14
