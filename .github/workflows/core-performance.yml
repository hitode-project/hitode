name: Core execution validation

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      slow-tests:
        description: Run the full DAC rate matrices
        type: boolean
        default: true
  schedule:
    # Daily at 09:17 Taipei, when macOS runners are free: refreshes the
    # master caches pull requests and the merge queue restore.
    - cron: '17 1 * * *'
    # Weekly at 11:17 Taipei: also runs the slow test matrices.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: core-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    name: gpu (lavapipe)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      ADV_GPU_REQUIRE_BACKEND: '1'
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Vulkan software driver and validation
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers
      - name: Test Vulkan backend
        run: cargo test --locked -p adv-gpu --lib --test conformance -- --nocapture
      - name: Test Vulkan stand-ins
        if: success() || failure()
        env:
          ADV_GPU_TEST_DISABLE: all
        run: cargo test --locked -p adv-gpu --lib --test conformance -- --nocapture

  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/core-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          rustup update stable --no-self-update
          test "$(uname -m)" = aarch64
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; lscpu; } > "$RUNNER_TEMP/core-environment.txt"
          cat "$RUNNER_TEMP/core-environment.txt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target/core-ci'
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: Lint execution layer
        run: cargo clippy --release --locked -p adv-cpu --all-targets -- -D warnings
      - name: Test execution layer
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --lib --tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/core-tests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-environment.txt
            ${{ runner.temp }}/core-tests.txt
          if-no-files-found: ignore
          retention-days: 14

  workspace-format:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          rustup update stable --no-self-update
          cargo fmt --all -- --check
      - name: Test runtime comparison gates
        run: python3 -m unittest discover -s tools/performance -v
      - name: Check crate layering
        run: |
          python3 -m unittest discover -s tools/layering -v
          python3 tools/layering/check_layers.py

  # macOS runners are scarce (an organization runs at most five macOS jobs
  # at once), so the two macOS jobs run only for the merge queue, the daily
  # cache refresh and manual runs. A pull request skips them, and a skipped
  # job counts as passed. The merge queue tests the exact commit master
  # becomes, so nothing reruns after a merge. The two jobs share their steps
  # through a YAML anchor; WORKSPACE_GROUP selects the group-only steps.
  workspace-core:
    name: workspace (core-system, macOS ARM64)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/workspace-ci
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      WORKSPACE_GROUP: core-system
      WORKSPACE_PACKAGES: >-
        --workspace --exclude adv-device --exclude adv-dx
        --exclude adv-runtime --exclude adv-shell --exclude adv-run
        --exclude adv-launcher --exclude adv-jit-helper --exclude tauri-plugin-storage
      WORKSPACE_FEATURES: ''
      WORKSPACE_SLOW_TESTS: 'false'
    steps: &workspace-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # The first parent is the merge queue's base.
          fetch-depth: 2
      - name: Record native ARM64 environment
        run: |
          rustup update stable --no-self-update
          test "$(uname -m)" = arm64
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; sw_vers; getconf PAGESIZE; } | tee "$RUNNER_TEMP/workspace-environment.txt"
      - name: Cache pinned FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/macos-ffmpeg/*/install
            target/macos-ffmpeg/*.tar.xz
          key: macos-arm64-ffmpeg-${{ hashFiles('tools/macos/build.py', 'tools/macos/ffmpeg.json') }}
      - name: Build pinned FFmpeg libraries
        timeout-minutes: 5
        run: |
          python3 tools/macos/build.py --ffmpeg-only --jobs 3
          prefix=("$GITHUB_WORKSPACE"/target/macos-ffmpeg/*/install)
          echo "FFMPEG_DIR=${prefix[0]}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(dirname "$(xcrun --find clang)")")/lib" >> "$GITHUB_ENV"
      # Wine probe tests run against the pinned userland; without it they
      # would fail in CI rather than skip (adv-nt/tests/common/wine.rs).
      - name: Cache pinned Wine userland
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/wine-dist
          key: wine-dist-${{ hashFiles('tools/release/wine.json') }}
      - name: Fetch the pinned Wine userland and the probe compiler
        timeout-minutes: 10
        run: |
          python3 tools/release/fetch_wine.py target/wine-dist dist
          echo "ADV_WINE_DIST=$GITHUB_WORKSPACE/target/wine-dist/wine11-sse-strip" >> "$GITHUB_ENV"
          brew install mingw-w64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.WORKSPACE_GROUP == 'runtime-apps'
        with:
          node-version: '24'
      - name: Check and build the launcher frontend
        if: env.WORKSPACE_GROUP == 'runtime-apps'
        timeout-minutes: 5
        run: |
          npm install --global "$(node --print "require('./apps/adv-launcher/package.json').packageManager")"
          pnpm --dir apps/adv-launcher install --frozen-lockfile
          pnpm --dir apps/adv-launcher check
          pnpm --dir apps/adv-launcher build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target/workspace-ci'
          # ffmpeg-sys does not rerun its build script when FFMPEG_DIR moves,
          # so a new FFmpeg build must not reuse cached link paths.
          key: ${{ env.WORKSPACE_GROUP }}-${{ hashFiles('tools/macos/build.py', 'tools/macos/ffmpeg.json') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: Build every crate with default features
        if: env.WORKSPACE_GROUP == 'core-system'
        timeout-minutes: 10
        run: cargo check --workspace --exclude adv-launcher --all-targets --locked
      - name: Lint the whole workspace
        if: env.WORKSPACE_GROUP == 'core-system'
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 tools/lint.py host 2>&1 | tee "$RUNNER_TEMP/workspace-clippy.txt"
      - name: Compile test programs
        timeout-minutes: 25
        run: |
          set -o pipefail
          read -r -a packages <<< "$WORKSPACE_PACKAGES"
          args=(--locked --lib --tests "${packages[@]}")
          if [[ -n "$WORKSPACE_FEATURES" ]]; then args+=(--features "$WORKSPACE_FEATURES"); fi
          if [[ "$WORKSPACE_SLOW_TESTS" == true ]]; then args+=(--features adv-device/slow-tests); fi
          cargo test "${args[@]}" --no-run --timings -v 2>&1 | tee "$RUNNER_TEMP/workspace-build.txt"
      - name: Execute tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          read -r -a packages <<< "$WORKSPACE_PACKAGES"
          args=(--locked --lib --tests "${packages[@]}")
          if [[ -n "$WORKSPACE_FEATURES" ]]; then args+=(--features "$WORKSPACE_FEATURES"); fi
          if [[ "$WORKSPACE_SLOW_TESTS" == true ]]; then args+=(--features adv-device/slow-tests); fi
          cargo test "${args[@]}" --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/workspace-tests.txt"
      # Behavior scenarios (docs/spec/README.md) judge this commit by the
      # latest master build the daily refresh cached, with that commit's own
      # scenarios and judge. Every master commit since then passed the same
      # gate, so its intended changes carry their claiming scenarios.
      - name: Restore the latest master build for behavior scenarios
        if: env.WORKSPACE_GROUP == 'runtime-apps'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/scenario-base
          key: scenario-adv-run-${{ github.sha }}
          restore-keys: scenario-adv-run-
      - name: Judge behavior scenarios
        if: env.WORKSPACE_GROUP == 'runtime-apps'
        timeout-minutes: 10
        run: |
          set -o pipefail
          head_bin="$RUNNER_TEMP/adv-run-head"
          cp "$CARGO_TARGET_DIR/debug/adv-run" "$head_bin"
          if [[ -f target/scenario-base/commit ]]; then
            base=$(cat target/scenario-base/commit)
            git fetch --depth 1 --no-tags origin "$base"
            base_bin=target/scenario-base/adv-run
          else
            echo "::warning::No cached master build; the scenarios judge this commit by itself."
            base=HEAD
            base_bin="$head_bin"
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          judge="$RUNNER_TEMP/base/tools/scenarios"
          [[ -f "$judge/run.py" ]] || judge=tools/scenarios
          python3 -m unittest discover -s "$judge"
          python3 "$judge/run.py" gate \
            --base-tree "$RUNNER_TEMP/base" --base-bin "$base_bin" \
            --head-tree . --head-bin "$head_bin" \
            --wine "$ADV_WINE_DIST" --out "$RUNNER_TEMP/scenarios.json" 2>&1 | tee "$RUNNER_TEMP/scenarios.txt"
          mkdir -p target/scenario-head
          cp "$head_bin" target/scenario-head/adv-run
          git rev-parse HEAD > target/scenario-head/commit
      - name: Cache this master build for later scenarios
        if: env.WORKSPACE_GROUP == 'runtime-apps' && github.ref == 'refs/heads/master'
        run: rm -rf target/scenario-base && mv target/scenario-head target/scenario-base
      - if: env.WORKSPACE_GROUP == 'runtime-apps' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/scenario-base
          key: scenario-adv-run-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-${{ env.WORKSPACE_GROUP }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-environment.txt
            ${{ runner.temp }}/workspace-clippy.txt
            ${{ runner.temp }}/workspace-build.txt
            ${{ runner.temp }}/workspace-tests.txt
            ${{ runner.temp }}/scenarios.json
            ${{ runner.temp }}/scenarios.txt
            target/workspace-ci/cargo-timings/
            target/scratch/macos-package/build-static.log
          if-no-files-found: ignore
          retention-days: 14

  workspace-apps:
    name: workspace (runtime-apps, macOS ARM64)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/workspace-ci
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      WORKSPACE_GROUP: runtime-apps
      WORKSPACE_PACKAGES: >-
        -p adv-device -p adv-dx -p adv-runtime -p adv-shell -p adv-run
        -p adv-launcher -p adv-jit-helper -p tauri-plugin-storage
      WORKSPACE_FEATURES: adv-shell/gpu,adv-shell/media
      WORKSPACE_SLOW_TESTS: ${{ github.event.schedule == '17 3 * * 1' || inputs.slow-tests == true }}
    steps: *workspace-steps
