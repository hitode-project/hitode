name: Core execution validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      slow-tests:
        description: Run the full DAC rate matrices
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: core-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/core-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          rustup update stable --no-self-update
          test "$(uname -m)" = aarch64
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; lscpu; } > "$RUNNER_TEMP/core-environment.txt"
          cat "$RUNNER_TEMP/core-environment.txt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target/core-ci'
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: Lint execution layer
        run: cargo clippy --release --locked -p adv-cpu --all-targets -- -D warnings
      - name: Test execution layer
        run: |
          set -o pipefail
          cargo test --release --locked -p adv-cpu --lib --tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/core-tests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-environment.txt
            ${{ runner.temp }}/core-tests.txt
          if-no-files-found: ignore
          retention-days: 14

  workspace-format:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          rustup update stable --no-self-update
          cargo fmt --all -- --check
      - name: Test runtime comparison gates
        run: python3 -m unittest discover -s tools/performance -v
      - name: Check crate layering
        run: |
          python3 -m unittest discover -s tools/layering -v
          python3 tools/layering/check_layers.py

  workspace-lint:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/workspace-ci
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record native ARM64 environment
        run: |
          rustup update stable --no-self-update
          test "$(uname -m)" = arm64
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; sw_vers; getconf PAGESIZE; } | tee "$RUNNER_TEMP/workspace-environment.txt"
      - name: Cache pinned FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/macos-ffmpeg/*/install
            target/macos-ffmpeg/*.tar.xz
          key: macos-arm64-ffmpeg-${{ hashFiles('tools/macos/build.py', 'tools/macos/ffmpeg.json') }}
      - name: Build pinned FFmpeg libraries
        timeout-minutes: 5
        run: |
          python3 tools/macos/build.py --ffmpeg-only --jobs 3
          prefix=("$GITHUB_WORKSPACE"/target/macos-ffmpeg/*/install)
          echo "FFMPEG_DIR=${prefix[0]}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(dirname "$(xcrun --find clang)")")/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target/workspace-ci'
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: Build every crate with default features
        timeout-minutes: 10
        run: cargo check --workspace --exclude adv-launcher --all-targets --locked
      - name: Lint the whole workspace
        timeout-minutes: 10
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --features adv-shell/gpu,adv-shell/media,adv-device/slow-tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/workspace-clippy.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-lint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-environment.txt
            ${{ runner.temp }}/workspace-clippy.txt
            target/scratch/macos-package/build-static.log
          if-no-files-found: ignore
          retention-days: 14

  workspace:
    name: workspace (${{ matrix.group }}, macOS ARM64)
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-system
            packages: >-
              --workspace --exclude adv-device --exclude adv-dx
              --exclude adv-runtime --exclude adv-shell --exclude adv-run
              --exclude adv-launcher --exclude adv-jit-helper --exclude tauri-plugin-storage
            features: ''
            media: false
          - group: graphics-runtime
            packages: -p adv-device -p adv-dx -p adv-runtime -p adv-shell -p adv-run
            features: adv-shell/gpu,adv-shell/media
            media: true
          - group: frontends
            packages: -p adv-launcher -p adv-jit-helper -p tauri-plugin-storage
            features: adv-shell/gpu
            media: true
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/workspace-ci
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      WORKSPACE_PACKAGES: ${{ matrix.packages }}
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      WORKSPACE_FEATURES: ${{ matrix.features }}
      WORKSPACE_GROUP: ${{ matrix.group }}
      WORKSPACE_SLOW_TESTS: ${{ github.event_name == 'schedule' || inputs.slow-tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record native ARM64 environment
        run: |
          rustup update stable --no-self-update
          test "$(uname -m)" = arm64
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; sw_vers; getconf PAGESIZE; } | tee "$RUNNER_TEMP/workspace-environment.txt"
      - name: Cache pinned FFmpeg
        if: matrix.media
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/macos-ffmpeg/*/install
            target/macos-ffmpeg/*.tar.xz
          key: macos-arm64-ffmpeg-${{ hashFiles('tools/macos/build.py', 'tools/macos/ffmpeg.json') }}
      - name: Build pinned FFmpeg libraries
        if: matrix.media
        timeout-minutes: 5
        run: |
          python3 tools/macos/build.py --ffmpeg-only --jobs 3
          prefix=("$GITHUB_WORKSPACE"/target/macos-ffmpeg/*/install)
          echo "FFMPEG_DIR=${prefix[0]}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(dirname "$(xcrun --find clang)")")/lib" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.group == 'frontends'
        with:
          node-version: '24'
      - name: Check and build the launcher frontend
        if: matrix.group == 'frontends'
        timeout-minutes: 5
        run: |
          npm install --global "$(node --print "require('./apps/adv-launcher/package.json').packageManager")"
          pnpm --dir apps/adv-launcher install --frozen-lockfile
          pnpm --dir apps/adv-launcher check
          pnpm --dir apps/adv-launcher build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target/workspace-ci'
          # ffmpeg-sys does not rerun its build script when FFMPEG_DIR moves,
          # so a new FFmpeg build must not reuse cached link paths.
          key: ${{ matrix.group }}-${{ hashFiles('tools/macos/build.py', 'tools/macos/ffmpeg.json') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: Compile test programs
        timeout-minutes: 25
        run: |
          set -o pipefail
          read -r -a packages <<< "$WORKSPACE_PACKAGES"
          args=(--locked --lib --tests "${packages[@]}")
          if [[ -n "$WORKSPACE_FEATURES" ]]; then args+=(--features "$WORKSPACE_FEATURES"); fi
          if [[ "$WORKSPACE_SLOW_TESTS" == true && "$WORKSPACE_GROUP" == graphics-runtime ]]; then
            args+=(--features adv-device/slow-tests)
          fi
          cargo test "${args[@]}" --no-run --timings -v 2>&1 | tee "$RUNNER_TEMP/workspace-build.txt"
      - name: Execute tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          read -r -a packages <<< "$WORKSPACE_PACKAGES"
          args=(--locked --lib --tests "${packages[@]}")
          if [[ -n "$WORKSPACE_FEATURES" ]]; then args+=(--features "$WORKSPACE_FEATURES"); fi
          if [[ "$WORKSPACE_SLOW_TESTS" == true && "$WORKSPACE_GROUP" == graphics-runtime ]]; then
            args+=(--features adv-device/slow-tests)
          fi
          cargo test "${args[@]}" --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/workspace-tests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-${{ matrix.group }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-environment.txt
            ${{ runner.temp }}/workspace-build.txt
            ${{ runner.temp }}/workspace-tests.txt
            target/workspace-ci/cargo-timings/
            target/scratch/macos-package/build-static.log
          if-no-files-found: ignore
          retention-days: 14
