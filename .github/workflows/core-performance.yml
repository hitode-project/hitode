name: Core execution validation

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/layering/**'
      - 'tools/performance/**'
      - '.github/workflows/core-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/core-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo --version; uname -a; lscpu; } > "$RUNNER_TEMP/core-environment.txt"
          cat "$RUNNER_TEMP/core-environment.txt"
      - name: Test runtime comparison gates
        run: python3 -m unittest discover -s tools/performance -v
      - name: Check crate layering
        run: |
          python3 -m unittest discover -s tools/layering -v
          python3 tools/layering/check_layers.py
      - name: Test execution layer
        run: |
          set -o pipefail
          cargo test --release -p adv-cpu --lib --tests 2>&1 | tee "$RUNNER_TEMP/core-tests.txt"
      - name: Record diagnostic synthetic benchmark
        run: |
          set -o pipefail
          cargo build --release -p adv-cpu --example execution_bench
          "$CARGO_TARGET_DIR/release/examples/execution_bench" 7 | tee "$RUNNER_TEMP/core-bench.csv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-environment.txt
            ${{ runner.temp }}/core-tests.txt
            ${{ runner.temp }}/core-bench.csv
          if-no-files-found: ignore
          retention-days: 14

  workspace:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the whole workspace
        run: cargo test-full --release --locked
      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
