name: Windows differential fixtures

# The authored fixtures in tools/fixtures run natively and under Hitode only on
# Windows (`#![cfg(windows)]` tests). This job is advisory and stays off pull
# requests: a cold Windows build takes about 20 minutes. It runs after merges
# that touch the fixtures (which also keeps the build cache warm), weekly, and on
# demand for a branch: `gh workflow run windows-differential.yml --ref <branch>`.
# Failures listed in tools/fixtures/hosted-known-failures.txt are reported but
# do not fail the run; a new failure does.

on:
  push:
    branches: [master]
    paths:
      - 'tools/fixtures/**'
      - 'crates/adv-win32/**'
      - 'crates/adv-runtime/tests/**'
      - 'crates/adv-device/tests/**'
      - '.github/workflows/windows-differential.yml'
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to check
        type: choice
        options: [all, adv-runtime, adv-win32, adv-device]
        default: all
      test:
        description: Optional Windows test target name
        type: string
        default: ''
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: windows-differential-${{ github.event.pull_request.number || github.ref }}-${{ inputs.crate || 'all' }}-${{ inputs.test || 'all' }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record Windows environment
        run: |
          $log = "$env:RUNNER_TEMP/differential-environment.txt"
          git rev-parse HEAD | Out-File $log
          rustc -Vv | Out-File $log -Append
          & 'C:/Program Files/LLVM/bin/clang-cl.exe' --version | Out-File $log -Append
          Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Name | Out-File $log -Append
          Get-Content $log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Run the Windows-only differential tests
        env:
          DIFFERENTIAL_CRATE: ${{ inputs.crate || 'all' }}
          DIFFERENTIAL_TEST: ${{ inputs.test }}
        run: |
          $features = @{ 'adv-runtime' = @('--features', 'gpu') }
          $failed = @()
          $tests = @()
          $matched = $false
          if ($env:DIFFERENTIAL_TEST -and $env:DIFFERENTIAL_TEST -notmatch '^[A-Za-z0-9_]+$') {
            throw 'Test must be an exact Cargo test target name'
          }
          foreach ($crate in 'adv-runtime', 'adv-win32', 'adv-device') {
            if ($env:DIFFERENTIAL_CRATE -ne 'all' -and $env:DIFFERENTIAL_CRATE -ne $crate) { continue }
            $targets = Get-ChildItem "crates/$crate/tests/*.rs" |
              Where-Object { (Get-Content $_ -TotalCount 5) -match '^#!\[cfg\(windows\)\]' } |
              Where-Object { -not $env:DIFFERENTIAL_TEST -or $_.BaseName -eq $env:DIFFERENTIAL_TEST } |
              ForEach-Object { '--test'; $_.BaseName }
            if (-not $targets) { continue }
            $matched = $true
            $extra = if ($features.ContainsKey($crate)) { $features[$crate] } else { @() }
            cargo test --locked -p $crate @extra @targets --no-fail-fast -- --nocapture 2>&1 |
              Tee-Object "$env:RUNNER_TEMP/differential-$crate.txt"
            $exit = $LASTEXITCODE
            $names = @(Get-Content "$env:RUNNER_TEMP/differential-$crate.txt" |
              Select-String '^test (\S+) \.\.\. FAILED' | ForEach-Object { $_.Matches[0].Groups[1].Value })
            # A nonzero exit without failed tests is a build or harness failure.
            if ($exit -ne 0 -and -not $names) { $failed += $crate }
            $tests += $names
          }
          if (-not $matched) { throw 'No Windows-only test targets matched the selection' }
          $known = @(Get-Content tools/fixtures/hosted-known-failures.txt |
            Where-Object { $_ -match '^\s*[^#\s]' } | ForEach-Object { ($_ -split '\s+')[0] })
          $new = @($tests | Where-Object { $_ -notin $known })
          $fixed = if ($env:DIFFERENTIAL_CRATE -eq 'all' -and -not $env:DIFFERENTIAL_TEST) {
            @($known | Where-Object { $_ -notin $tests })
          } else { @() }
          foreach ($name in $tests) { "::warning::differential test failed: $name" }
          foreach ($name in $fixed) { "::notice::known failure now passes; remove it from the list: $name" }
          if ($failed) { throw "build or harness failure in: $($failed -join ', ')" }
          if ($new) { throw "new differential failures: $($new -join ', ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-differential-${{ github.sha }}
          path: |
            ${{ runner.temp }}/differential-*.txt
            target/investigations/**/cmd.txt
          if-no-files-found: ignore
          retention-days: 14
