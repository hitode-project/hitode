name: Windows differential fixtures

# The authored fixtures in tools/fixtures run natively and under Hitode only on
# Windows (`#![cfg(windows)]` tests). This job is advisory: it is not a required
# check, and its logs give contributors without Windows the native reference.

on:
  pull_request:
    paths:
      - 'tools/fixtures/**'
      - 'crates/adv-win32/**'
      - 'crates/adv-runtime/tests/**'
      - 'crates/adv-device/tests/**'
      - '.github/workflows/windows-differential.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: windows-differential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record Windows environment
        run: |
          $log = "$env:RUNNER_TEMP/differential-environment.txt"
          git rev-parse HEAD | Out-File $log
          rustc -Vv | Out-File $log -Append
          & 'C:/Program Files/LLVM/bin/clang-cl.exe' --version | Out-File $log -Append
          Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Name | Out-File $log -Append
          Get-Content $log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Run the Windows-only differential tests
        run: |
          $features = @{ 'adv-runtime' = @('--features', 'gpu') }
          $failed = @()
          foreach ($crate in 'adv-runtime', 'adv-win32', 'adv-device') {
            $tests = Get-ChildItem "crates/$crate/tests/*.rs" |
              Where-Object { (Get-Content $_ -TotalCount 5) -match '^#!\[cfg\(windows\)\]' } |
              ForEach-Object { '--test'; $_.BaseName }
            if (-not $tests) { continue }
            $extra = if ($features.ContainsKey($crate)) { $features[$crate] } else { @() }
            cargo test --locked -p $crate @extra @tests --no-fail-fast -- --nocapture 2>&1 |
              Tee-Object "$env:RUNNER_TEMP/differential-$crate.txt"
            if ($LASTEXITCODE -ne 0) { $failed += $crate }
          }
          if ($failed) { throw "differential tests failed in: $($failed -join ', ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-differential-${{ github.sha }}
          path: |
            ${{ runner.temp }}/differential-*.txt
            target/investigations/**/cmd.txt
          if-no-files-found: ignore
          retention-days: 14
