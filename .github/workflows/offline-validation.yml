name: Offline core validation kit
on:
  push:
    branches: [perf/tiered-execution-10x]
    paths: ['.github/workflows/offline-validation.yml']
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare independent core manifest
        shell: python
        run: |
          import os, pathlib, re, shutil
          source = pathlib.Path('crates/adv-jit')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kit/core'
          shutil.copytree(source, target)
          manifest = (source / 'Cargo.toml').read_text()
          manifest = manifest.replace('edition.workspace = true', 'edition = "2024"')
          manifest = manifest.replace('publish.workspace = true', 'publish = false')
          manifest = manifest.replace('pal = ["dep:pal-cpu"]', 'pal = []')
          manifest = re.sub(r'^pal-(?:cpu|machine|win32)\s*=.*\n', '', manifest, flags=re.M)
          manifest = manifest.replace('[lints]\nworkspace = true', '[workspace]')
          (target / 'Cargo.toml').write_text(manifest)
          shutil.copy('Cargo.lock', target / 'Cargo.lock')
          for test in (target / 'tests').glob('*.rs'):
              if re.search(r'\bpal_(?:cpu|machine|win32)\b|adv_jit::pal\b', test.read_text()):
                  test.rename(test.with_suffix('.rs.disabled'))
      - name: Collect public compiler and crates only
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kit"
          mkdir -p .cargo toolchain/bin toolchain/lib/rustlib/x86_64-unknown-linux-gnu
          cargo vendor --manifest-path core/Cargo.toml vendor > .cargo/config.toml
          root="$(rustc --print sysroot)"
          for name in rustc cargo rustfmt; do cp "$root/bin/$name" toolchain/bin/; done
          cp "$root"/lib/*.so* toolchain/lib/
          cp -a "$root/lib/rustlib/x86_64-unknown-linux-gnu/lib" toolchain/lib/rustlib/x86_64-unknown-linux-gnu/
          rustc -Vv > compiler.txt
          tar -czf "$RUNNER_TEMP/core-offline-kit.tar.gz" .cargo core vendor toolchain compiler.txt
          du -h "$RUNNER_TEMP/core-offline-kit.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-offline-kit
          path: ${{ runner.temp }}/core-offline-kit.tar.gz
          retention-days: 1
          compression-level: 0
