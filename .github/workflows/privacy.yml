name: Privacy scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the scanner
        run: python3 -m unittest discover -s tools/privacy -v
      - name: Scan files for host paths and email addresses
        run: python3 tools/privacy/scan.py
